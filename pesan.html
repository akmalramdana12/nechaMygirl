<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kotak Jawaban</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pesan.css">
</head>
<body>

<div class="pj-wrap">
  <header class="pj-header">
    <h1 class="pj-title">Kotak Jawaban</h1>
    <p class="pj-sub">Semua jawaban dari halaman "Kenalan Dulu, Yuk!" muncul di sini. Halaman ini hanya tersimpan di perangkat/browser tempat jawaban itu dikirim.</p>
  </header>

  <div class="pj-empty" id="pj-empty" hidden>
    Belum ada jawaban yang masuk.
  </div>

  <div class="pj-list" id="pj-list"></div>

  <div class="pj-detail-overlay" id="pj-detail-overlay">
    <div class="pj-detail-card" id="pj-detail-card">
      <button class="pj-close" id="pj-close" aria-label="Tutup" type="button">&times;</button>
      <div class="pj-detail-inner" id="pj-detail-inner"></div>
    </div>
  </div>
</div>

<script src="pesan.js"></script>
</body>
</html>
